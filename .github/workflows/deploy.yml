name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

concurrency:
  group: cf-pages-deploy
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate JSON schema (block on errors, allow warnings)
        # exit 0 = clean, 1 = schema error (block), 2 = warnings (pass)
        run: |
          set +e
          python3 scripts/validate.py
          rc=$?
          if [ $rc -eq 0 ] || [ $rc -eq 2 ]; then
            echo "validator rc=$rc (acceptable)"
            exit 0
          fi
          echo "validator rc=$rc (blocking)"
          exit $rc

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.95.0 pages deploy . \
            --project-name=government-ai-map \
            --branch=main \
            --commit-dirty=true
